name: build

# Проверочная сборка при каждом пуше: установщик лежит в артефактах (вкладка Actions).
# Релиз выпускается отдельным сценарием release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Version
        shell: pwsh
        run: |
          $v = python tools/set_version.py
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm --clean SimpleZapretGUI.spec

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # антивирус может держать свежий Setup.exe (EndUpdateResource failed) — пробуем до 3 раз
          for ($i = 1; $i -le 3; $i++) {
            & $iscc "/DAppVersion=$env:VERSION" installer\SimpleZapretGUI.iss
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { exit 1 }
            Start-Sleep -Seconds 5
          }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\SimpleZapretGUI\* -DestinationPath "dist-installer\SimpleZapretGUI-portable-$env:VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleZapretGUI-${{ env.VERSION }}
          path: dist-installer/*
