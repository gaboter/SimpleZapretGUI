name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm --clean SimpleZapretGUI.spec

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $ver = "1.0.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $ver = $env:GITHUB_REF_NAME.Substring(1) }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # антивирус может держать свежий Setup.exe (EndUpdateResource failed) — пробуем до 3 раз
          for ($i = 1; $i -le 3; $i++) {
            & $iscc "/DAppVersion=$ver" installer\SimpleZapretGUI.iss
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { exit 1 }
            Start-Sleep -Seconds 5
          }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\SimpleZapretGUI\* -DestinationPath dist-installer\SimpleZapretGUI-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleZapretGUI
          path: dist-installer/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*
